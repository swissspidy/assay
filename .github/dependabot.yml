version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node 24 is the supported floor; keep its types on 24.x.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        patterns: ['oxlint', 'oxfmt', 'tsrs', '@types/*', '@playwright/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
